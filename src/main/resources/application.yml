spring:
  application:
    name: nutribot

  datasource:
    url: jdbc:h2:mem:nutribot

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        completions-path: ${OPENAI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${OPENAI_MODEL:gemini-2.5-flash}
      embedding:
        base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        embeddings-path: ${OPENAI_EMBEDDINGS_PATH:/embeddings}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-004}

server:
  port: 8080